name: Keep Alive

on:
  schedule:
    - cron: "0 0 * * 0,3" # Runs every Sunday and Wednesday
  workflow_dispatch:

jobs:
  send-http-request:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_URL: ${{ github.ref == 'refs/head/main' && secrets.NEXT_PUBLIC_PROD_URL || secrets.NEXT_PUBLIC_DEV_URL }}
      PAYLOAD_FRONTEND_SHARED_SECRET: ${{ github.ref == 'refs/head/main' && secrets.PAYLOAD_FRONTEND_PROD_SHARED_SECRET || secrets.PAYLOAD_FRONTEND_DEV_SHARED_SECRET }}

    steps:
      - name: Send HTTP Request
        run: |
          curl -H "Authorization: Bearer ${{ env.PAYLOAD_FRONTEND_SHARED_SECRET }}" \
            "${{ env.NEXT_PUBLIC_URL }}/keep-alive"
